services:
  mysql:
    image: mysql:8.0
    container_name: ve-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voucher_engine
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=256M
    volumes:
      - ./src/main/resources:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: ve-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noevition

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ve-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest