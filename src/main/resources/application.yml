server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/voucher_engine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual # 强制手动ACK：写库成功才删消息，防止断电丢单
    publisher-confirm-type: correlated   # 开启异步确认（到达 Exchange 回调）
    publisher-returns: true              # 开启路由失败退回（到达不了 Queue 回调）
    template:
      mandatory: true                    # 必须配 true，否则路由失败不会触发 ReturnsCallback

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL，方便你观察缓存有没有穿透打到数据库

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%-5level] [%X{traceId:-NO_TRACE}] %logger{36} - %msg%n"