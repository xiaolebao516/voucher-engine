server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/voucher_engine?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual # 强制手动ACK：写库成功才删消息，防止断电丢单
    publisher-confirm-type: correlated   # 开启异步确认（到达 Exchange 回调）
    publisher-returns: true              # 开启路由失败退回（到达不了 Queue 回调）
    template:
      mandatory: true                    # 必须配 true，否则路由失败不会触发 ReturnsCallback

  task:
    scheduling:
      pool:
        # 默认只有 1 个调度线程，三个 @Scheduled 任务会互相排队：
        # 数据清理一旦跑上几分钟，每 3 秒一次的本地消息投递就会被完全阻塞。
        # 这里给到 4，保证清理任务和投递任务互不干扰。
        size: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL，方便你观察缓存有没有穿透打到数据库

seckill:
  order-consumer:
    # 固定消费者数，默认保持原单消费者基线；压测可覆盖为 2 或 4。
    concurrency: 1
  rate-limit:
    # 压测开关：关闭后限流直接放行，用于「开启/关闭限流」两轮对照压测
    enabled: true
    # 用户级：容量 5，每秒补 2 个令牌（单个用户最多连抢 5 次，之后每 0.5s 一次）
    user-capacity: 5
    user-rate: 2
    # 全局级：容量 1000，每秒补 400 个令牌（系统总闸门）
    global-capacity: 1000
    global-rate: 400

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%-5level] [%X{traceId:-NO_TRACE}] %logger{36} - %msg%n"